# Conda environment for the ParaMAG pipeline.
# Versions are pinned to the ones that ran on the lab server (first run, November 2026).
#
# Create:   conda env create -f envs/paramag.yml
# Activate: conda activate paramag
name: paramag
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - snakemake=7.32.4
  # read QC and trimming
  - fastqc=0.13.0
  - trimmomatic=0.41
  # assembly
  - spades=4.3.0
  # read mapping and coverage
  - bowtie2=2.5.5
  - samtools=1.24
  # binning
  - maxbin2=2.2.7
  # genome completeness; miniprot and metaeuk are pinned because they change BUSCO scores
  - busco=6.1.0
  - miniprot=0.18
  - metaeuk=7.bba0d80
  # phylogeny
  - mafft=7.526
  - trimal=1.5.1
  - iqtree=3.1.4
  - fasttree=2.2.0
